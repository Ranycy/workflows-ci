name: MLflow CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9

      - name: Install dependencies
        run: |
          pip install mlflow scikit-learn pandas numpy imbalanced-learn joblib

      - name: Run MLflow Project
        run: |
          cd MLProject
          python modelling.py

      - name: List outputs
        run: |
          ls -R MLProject
